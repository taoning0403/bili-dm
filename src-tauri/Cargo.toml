[package]
name = "bili-dm"
version = "0.1.0"
description = "A local-first desktop media player"
edition = "2021"
publish = false

[lib]
name = "bili_dm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-dialog = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
